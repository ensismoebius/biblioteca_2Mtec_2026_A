name: Política de Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  verificar-politica-pr:
    name: verificar-politica-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rodar verificação
        id: verificacao
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/verificar_politica_pr.py

      - name: Publicar artefato do comentário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-politica
          path: |
            /tmp/comentario.md
            /tmp/pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
