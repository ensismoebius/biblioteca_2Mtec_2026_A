name: Code Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  code-intelligence:
    name: code-intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir que a base do PR está disponível localmente
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/code_intelligence/requirements-ci.txt

      - name: Instalar dependências do code-intelligence
        run: pip install --disable-pip-version-check -r .github/code_intelligence/requirements-ci.txt

      - name: Rodar verificação de regressões (PR vs. main)
        id: verificacao
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/verificar_code_intelligence.py

      - name: Publicar artefato do comentário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-code-intelligence
          path: |
            /tmp/comentario.md
            /tmp/pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
