name: Estilo de Código (Pint)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  pint:
    name: pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        id: composer_install
        continue-on-error: true
        run: |
          set +e
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee /tmp/composer-install.log
          exit "${PIPESTATUS[0]}"

      - name: Diagnosticar falha ao instalar dependências
        if: steps.composer_install.outcome == 'failure'
        run: |
          {
            echo "<!-- pint-bot -->"
            echo "## ❌ Falha ao instalar dependências (composer install)"
            echo ""
            echo "O Composer não conseguiu instalar as dependências do projeto. Na"
            echo "grande maioria dos casos isso é um **descompasso de versão do PHP**"
            echo "entre o que está travado no \`composer.lock\` (PHP 8.4+) e o PHP"
            echo "realmente usado para rodar o \`composer install\`."
            echo ""
            echo "**Rodando isso no seu computador?** Você quase certamente rodou"
            echo "\`composer install\` **fora** do ambiente do Portaravel. Fora do"
            echo "\`./shell.sh\` (Linux) / \`shell.bat\` (Windows), o \`composer\`/\`php\`"
            echo "do seu terminal normal aponta para o PHP instalado no seu sistema"
            echo "(pode ser uma versão mais antiga, como 8.3), não para o PHP 8.4"
            echo "empacotado no Portaravel. **Como corrigir:** abra \`./shell.sh\` ou"
            echo "\`shell.bat\`, e rode \`composer install\` de novo lá dentro. Se"
            echo "quiser confirmar antes, rode \`php -v\` dentro do shell — deve"
            echo "mostrar PHP 8.4.x."
            echo ""
            echo "**Vendo isso aqui no CI (GitHub Actions)?** Não é algo que você"
            echo "causou — fale com o professor, provavelmente o workflow"
            echo "\`pint.yml\` precisa ser ajustado para a versão de PHP que o"
            echo "\`composer.lock\` do projeto exige."
            echo ""
            echo "<details><summary>Saída completa do <code>composer install</code></summary>"
            echo ""
            echo '```'
            cat /tmp/composer-install.log
            echo '```'
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/comentario.md
          echo "${{ github.event.pull_request.number }}" > /tmp/pr_number.txt
          exit 1

      - name: Rodar Pint
        if: steps.composer_install.outcome == 'success'
        run: |
          if ./vendor/bin/pint --test; then
            corpo="<!-- pint-bot -->
          ## ✅ Pint — nenhum problema de estilo"
          else
            pint_ok=1
            corpo="<!-- pint-bot -->
          ## ❌ Pint encontrou problemas de estilo

          Rode \`./vendor/bin/pint\` localmente (sem \`--test\`) para corrigir automaticamente, depois faça commit e push."
          fi
          echo "$corpo" >> "$GITHUB_STEP_SUMMARY"
          echo "$corpo" > /tmp/comentario.md
          echo "${{ github.event.pull_request.number }}" > /tmp/pr_number.txt
          [ -z "$pint_ok" ]

      - name: Publicar artefato do comentário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-pint
          path: |
            /tmp/comentario.md
            /tmp/pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
