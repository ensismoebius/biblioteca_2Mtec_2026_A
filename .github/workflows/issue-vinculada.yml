name: Issue Vinculada

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  verificar-issue-vinculada:
    name: verificar-issue-vinculada
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (apenas para ter o script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Verificar referência de fechamento na descrição do PR
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verificar_issue_vinculada.py

      - name: Publicar artefato do comentário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-issue-vinculada
          path: |
            /tmp/comentario.md
            /tmp/pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
